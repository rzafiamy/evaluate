system_prompt: |
  You need to reply with deep thinking and concise responses based on the given question and context.
  Your response should be clear and unambiguous, without any ambiguity or uncertainty.
tests:
  - prompt: "How many vowels are in the word 'encyclopedia'?"
    test: 1
    category: "attention to detail"
    expected: "'Encyclopedia' contains 6 vowels: e, y, o, e, i, and a."
    temperature: 0.3
    max_tokens: 100
    language: "en"
  
  - prompt: "What is the third word in the sentence: 'Precision in details improves accuracy'?"
    test: 2
    category: "attention to detail"
    expected: "The third word in the sentence is 'details'."
    temperature: 0.3
    max_tokens: 100
    language: "en"
  
  - prompt: "In the sentence 'The quick brown fox jumps over the lazy dog', how many times does the letter 'o' appear?"
    test: 3
    category: "attention to detail"
    expected: "The letter 'o' appears 4 times in the sentence."
    temperature: 0.3
    max_tokens: 100
    language: "en"
  
  - prompt: "Which number is missing in this pattern: 1, 3, 6, __, 15?"
    test: 4
    category: "attention to detail"
    expected: "The missing number is 10, as the pattern increases by 2, 3, 4, and then 5."
    temperature: 0.3
    max_tokens: 200
    language: "en"
  
  - prompt: "Identify the grammatical error in the sentence: 'She go to the market every morning.'"
    test: 5
    category: "attention to detail"
    expected: "The verb 'go' should be 'goes' to match the singular subject 'She'."
    temperature: 0.3
    max_tokens: 100
    language: "en"
  
  - prompt: "Which of these sentences contains an inconsistency? 'Tomorrow, I will finish my work and send the report.' 'Yesterday, I completed my task and submit my report.'"
    test: 6
    category: "attention to detail"
    expected: "The second sentence contains an inconsistency because 'completed' is past tense, while 'submit' is present tense."
    temperature: 0.3
    max_tokens: 100
    language: "en"
  
  - prompt: "What is the sum of all the digits in the number 548?"
    test: 7
    category: "attention to detail"
    expected: "The sum of the digits 5, 4, and 8 is 17."
    temperature: 0.3
    max_tokens: 100
    language: "en"
  
  - prompt: "Find the inconsistency in this statement: 'Sarah has 12 apples. She gave away 5 and now has 8 left.'"
    test: 8
    category: "attention to detail"
    expected: "The inconsistency is in the final count; after giving away 5 apples, Sarah should have 7 left, not 8."
    temperature: 0.3
    max_tokens: 100
    language: "en"
  
  - prompt: "Which day has a different time schedule? Monday 9am-5pm, Tuesday 9am-5pm, Wednesday 10am-5pm, Thursday 9am-5pm, Friday 9am-5pm."
    test: 9
    category: "attention to detail"
    expected: "Wednesday has a different schedule, as it starts at 10am instead of 9am."
    temperature: 0.3
    max_tokens: 100
    language: "en"
  
  - prompt: "Which of these words does NOT contain the letter 'e'? 'Telescope', 'Mountain', 'Speed', 'Elephant'."
    test: 10
    category: "attention to detail"
    expected: "'Mountain' does not contain the letter 'e', while the other words do."
    temperature: 0.3
    max_tokens: 100
    language: "en"
  