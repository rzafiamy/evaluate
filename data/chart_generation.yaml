system_prompt: |
  You are an AI that generates JSON representations of different types of charts based on the given prompt. Ensure the JSON structure is correct and follows the provided examples.
  Available chart types and formats:
  - Line Chart: {"chart_type": "line", "title": "Title", "xlabel": "X-Axis Label", "ylabel": "Y-Axis Label", "data": {"labels": ["X1", "X2", "X3"], "values": [Y1, Y2, Y3]}}
  - Bar Chart: {"chart_type": "bar", "title": "Title", "xlabel": "X-Axis Label", "ylabel": "Y-Axis Label", "data": {"labels": ["Category1", "Category2"], "values": [Value1, Value2]}}
  - Scatter Plot: {"chart_type": "scatter", "title": "Title", "xlabel": "X-Axis Label", "ylabel": "Y-Axis Label", "data": {"labels": [X1, X2, X3], "values": [Y1, Y2, Y3]}}
  - Pie Chart: {"chart_type": "pie", "title": "Title", "data": {"labels": ["Category1", "Category2"], "values": [Percentage1, Percentage2]}}
  - Histogram: {"chart_type": "histogram", "title": "Title", "xlabel": "X-Axis Label", "ylabel": "Y-Axis Label", "data": {"labels": ["Range1", "Range2"], "values": [Frequency1, Frequency2]}}
  - Boxplot: {"chart_type": "boxplot", "title": "Title", "data": {"labels": ["Category1", "Category2"], "values": [[Min, Q1, Median, Q3, Max], [...]]}}
tests:
  - test: 1
    prompt: "Generate a line chart with data for January to May."
    category: "chart_generation"
    expected: '{"chart_type": "line", "title": "Example", "xlabel": "X-Axis", "ylabel": "Y-Axis", "data": {"labels": ["Jan", "Feb", "Mar", "Apr", "May"], "values": [1000, 1500, 1200, 1800, 1600]}}'
    temperature: 0.3
    max_tokens: 100
    language: "en"
  
  - test: 2
    prompt: "Generate a bar chart comparing Product A, B, and C sales."
    category: "chart_generation"
    expected: '{"chart_type": "bar", "title": "Product Sales", "xlabel": "Products", "ylabel": "Units Sold", "data": {"labels": ["Product A", "Product B", "Product C"], "values": [500, 700, 900]}}'
    temperature: 0.3
    max_tokens: 100
    language: "en"

  - test: 3
    prompt: "Generate a scatter plot for height vs weight data."
    category: "chart_generation"
    expected: '{"chart_type": "scatter", "title": "Height vs Weight", "xlabel": "Height (cm)", "ylabel": "Weight (kg)", "data": {"labels": [150, 160, 170, 180, 190], "values": [50, 60, 70, 80, 90]}}'
    temperature: 0.3
    max_tokens: 100
    language: "en"

  - test: 4
    prompt: "Generate a pie chart representing market share of companies."
    category: "chart_generation"
    expected: '{"chart_type": "pie", "title": "Market Share", "data": {"labels": ["Company A", "Company B", "Company C"], "values": [40, 35, 25]}}'
    temperature: 0.3
    max_tokens: 100
    language: "en"
  
  - test: 5
    prompt: "Generate a histogram for exam scores distribution."
    category: "chart_generation"
    expected: '{"chart_type": "histogram", "title": "Exam Scores Distribution", "xlabel": "Score Ranges", "ylabel": "Frequency", "data": {"labels": ["0-20", "21-40", "41-60", "61-80", "81-100"], "values": [5, 15, 30, 25, 10]}}'
    temperature: 0.3
    max_tokens: 100
    language: "en"

  - test: 6
    prompt: "Generate a box plot for exam scores distribution in different subjects."
    category: "chart_generation"
    expected: '{"chart_type": "boxplot", "title": "Exam Scores", "data": {"labels": ["Math", "Science", "English"], "values": [[65, 70, 75, 80, 90], [50, 55, 60, 85, 95], [40, 50, 55, 60, 75]]}}'
    temperature: 0.3
    max_tokens: 100
    language: "en"
