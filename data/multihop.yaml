system_prompt: |
  You are an AI assistant skilled at interpreting ambiguous questions and providing well-reasoned responses. 
  If necessary, infer missing details before answering accurately.
tests:
  - test: 1
    prompt: "What was the official language of the country where the tallest mountain is located, during the year when the country won its first Olympic gold medal?"
    category: "multi-step_ambiguity"
    expected: "1. The tallest mountain is Mount Everest.\n2. Mount Everest is in Nepal.\n3. Nepal won its first Olympic gold medal in 1984.\n4. The official language of Nepal in 1984 was Nepali.\nFinal answer: Nepali."
    temperature: 0.5
    max_tokens: 200
    language: "en"

  - test: 2
    prompt: "Who was the president of the country that borders the nation where the Eiffel Tower is located, at the time when the Mars Rover Curiosity landed?"
    category: "multi-step_ambiguity"
    expected: "1. The Eiffel Tower is in France.\n2. France shares a border with Germany.\n3. The Mars Rover Curiosity landed in 2012.\n4. The president of Germany in 2012 was Joachim Gauck.\nFinal answer: Joachim Gauck."
    temperature: 0.5
    max_tokens: 200
    language: "en"

  - test: 3
